<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }
    
    .btn {
        background: rgba(92, 92, 92, 0.493);
        color: #333;
        padding: 20px 110px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        position: absolute;
    }   
    
    /* Обертка для галереи со стрелками */
    .gallery-wrapper {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 1504px;
    }

    .gallery {
        display: flex;
        gap: 40px;
        overflow-x: auto;
        flex: 1;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE */
    }

    .gallery::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
    }

    .gallery img {
        width: 400px;
        cursor: pointer;
        object-fit: fill;
        flex-shrink: 0;
    }

    /* Стрелки для галерей */
    .gallery-arrow {
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        flex-shrink: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
    }

    .gallery-arrow:hover {
        background: rgba(0, 0, 0, 0.8);
        transform: scale(1.1);
    }

    .gallery-arrow:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        transform: none;
    }

    /* Стили для модальных окон */
    .modal {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,.85);
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity .3s ease;
        z-index: 1000;
    }

    .modal.show {
        display: flex;
        opacity: 1;
    }

    .bigImage {
        max-width: 90%;
        max-height: 90%;
        transform: scale(0.8);
        opacity: 0;
        transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .modal.show .bigImage {
        transform: scale(1);
        opacity: 1;
    }

    .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 60px;
        color: white;
        cursor: pointer;
        user-select: none;
        padding: 20px;
        z-index: 1001;
    }

    .left {
        left: 30px;
    }

    .right {
        right: 30px;
    }

    .close {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 50px;
        cursor: pointer;
        user-select: none;
        z-index: 1001;
    }

    .arrow:hover{
        color: #aaaaaa;
    }
    .close:hover {
        color: #ff4e4e;
    }

</style>
